<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Островок! Экстранет — Hollywood Media Hotel</title>
<style>
  @font-face {
    font-family: 'PT Root UI';
    src: url('fonts/PTRootUI-VF.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: 'PT Root UI';
    src: url('fonts/PTRootUI-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'PT Root UI';
    src: url('fonts/PTRootUI-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: 'PT Root UI';
    src: url('fonts/PTRootUI-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #0E41D2;
    --blue-light: #E3EBFD;
    --bg: #F4F4F4;
    --text: #2D3137;
    --text-mid: #464A4F;
    --text-muted: #868686;
    --white: #FFFFFF;
    --green: #53AF24;
    --red: #CE2121;
    --red-light: #EBA6A6;
    --border: #E5E5E5;
    --radius: 16px;
    --font: 'PT Root UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 16px;
  }

  /* ─── HEADER ─── */
  .header {
    background: var(--white);
    border-bottom: 0.5px solid var(--bg);
    padding: 0 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    text-decoration: none;
  }

  .logo-ost { color: var(--blue); }
  .logo-ext { color: var(--text); }

  .hotel-name-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .hotel-name-btn:hover { background: var(--bg); }

  .hotel-name-btn span {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .chevron-icon {
    width: 14px;
    height: 14px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .status-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
  }

  .hint-btn {
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    position: relative;
  }
  .hint-btn::before {
    content: '';
    position: absolute;
    inset: 3px;
    background: rgba(0,0,0,0.04);
    border-radius: 4px;
  }

  .header-right { display: flex; align-items: center; gap: 24px; }

  .user-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s;
    position: relative;
  }
  .user-btn:hover { background: var(--bg); }

  .avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--blue-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    flex-shrink: 0;
  }

  .user-info { display: flex; flex-direction: column; text-align: left; }
  .user-name { font-size: 16px; font-weight: 500; color: var(--text); white-space: nowrap; }
  .user-email { font-size: 14px; color: var(--text-muted); white-space: nowrap; }

  /* dropdown */
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    min-width: 200px;
    padding: 6px;
    display: none;
    z-index: 200;
  }
  .dropdown-menu.open { display: block; }

  .dropdown-item {
    display: block;
    width: 100%;
    padding: 10px 14px;
    border: none;
    background: none;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    font-family: var(--font);
    transition: background 0.12s;
  }
  .dropdown-item:hover { background: var(--bg); }
  .dropdown-item.danger { color: var(--red); }

  /* top nav */
  .top-nav {
    display: flex;
    gap: 24px;
  }

  .nav-item {
    background: none;
    border: none;
    padding: 0 0 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    font-family: var(--font);
    white-space: nowrap;
    position: relative;
    top: 2px;
  }
  .nav-item.active { color: var(--blue); border-bottom-color: var(--blue); }
  .nav-item:hover:not(.active) { color: var(--text); }

  /* ─── BODY LAYOUT ─── */
  .body-layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 64px 20px 80px;
  }

  .sidebar-items { display: flex; flex-direction: column; gap: 4px; }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 24px;
    border-radius: 8px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-muted);
    font-family: var(--font);
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .sidebar-item:hover:not(.active) { background: rgba(0,0,0,0.04); }
  .sidebar-item.active { background: var(--white); color: var(--blue); }

  /* ─── MAIN CONTENT ─── */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 32px 40px 0;
    padding-bottom: 80px;
  }

  .content-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 36px 40px 40px;
    flex: 1;
  }

  /* section title */
  .section-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .section-subtitle { font-size: 16px; font-weight: 500; color: var(--text-mid); margin-bottom: 20px; }

  /* age cards widget */
  .widget {
    background: var(--bg);
    border-radius: 20px;
    padding: 12px;
    display: inline-flex;
    gap: 12px;
  }

  .age-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px;
    width: 218px;
    height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .age-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

  .age-card.disabled {
    background: var(--bg);
    box-shadow: inset 0 4px 40px rgba(0,0,0,0.08);
  }
  .age-card.disabled:hover { box-shadow: inset 0 4px 40px rgba(0,0,0,0.08); }

  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    width: 100%;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 22px;
  }

  .card-title.muted { color: var(--text-muted); }

  /* kebab button */
  .kebab-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s;
    position: relative;
  }
  .kebab-btn:hover { background: var(--bg); }

  .kebab-dots {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
  }
  .kebab-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text);
  }

  /* card price area */
  .card-price { display: flex; flex-direction: column; gap: 12px; width: 100%; }

  .price-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 20px;
  }
  .price-label.muted { color: var(--text-muted); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px 5px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 500;
    line-height: 22px;
    width: fit-content;
  }
  .badge.blue { background: var(--blue-light); color: var(--text); }
  .badge.red {
    background: var(--red-light);
    color: var(--red);
    padding: 3px;
    line-height: 0;
    border-radius: 50%;
  }

  .price-row {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
  }

  .price-desc {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    line-height: 20px;
  }

  /* kebab dropdown */
  .kebab-menu {
    position: absolute;
    top: 36px;
    right: 0;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    min-width: 160px;
    padding: 6px;
    display: none;
    z-index: 50;
  }
  .kebab-menu.open { display: block; }

  .kebab-action {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    border: none;
    background: none;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    font-family: var(--font);
    font-weight: 500;
    transition: background 0.12s;
  }
  .kebab-action:hover { background: var(--bg); }
  .kebab-action.danger { color: var(--red); }

  /* ─── PINNED FOOTER ─── */
  .pinned-footer {
    position: fixed;
    bottom: 0;
    left: 240px;
    right: 0;
    display: flex;
    justify-content: center;
    padding: 0 40px 0;
    z-index: 90;
  }

  .pinned-inner {
    background: var(--white);
    border-radius: 16px 16px 0 0;
    padding: 16px 30px;
    display: flex;
    gap: 16px;
    width: 100%;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
  }

  .btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn:active { transform: scale(0.98); }

  .btn-primary { background: #FF0000; color: var(--white); }
  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary { background: #FF0000; color: var(--white); }
  .btn-secondary:hover { opacity: 0.8; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ─── OVERLAY ─── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
  }
  .overlay.active { display: block; }

  /* ─── TOOLTIP ─── */
  .tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--white);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
  }
  .hint-btn:hover .tooltip { opacity: 1; }

  /* ─── NO NOT ACCOMMODATED icon ─── */
  .no-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .no-icon::after {
    content: '×';
    color: white;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }
</style>
</head>
<body>

<!-- Overlay to close menus on outside click -->
<div class="overlay" id="overlay"></div>

<!-- ─── HEADER ─── -->
<header class="header">
  <div class="header-top">
    <div class="header-left">
      <!-- Logo -->
      <a class="logo" href="#">
        <span class="logo-ost">Островок!</span>&nbsp;<span class="logo-ext">Экстранет</span>
      </a>

      <!-- Hotel name dropdown -->
      <div style="position:relative">
        <button class="hotel-name-btn" id="hotelBtn" onclick="toggleMenu('hotelMenu', 'hotelBtn')">
          <span>Hollywood Media Hotel (ID: 511454725)</span>
          <svg class="chevron-icon" id="hotelChevron" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 5L7 9L11 5" stroke="#2D3137" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="dropdown-menu" id="hotelMenu">
          <button class="dropdown-item">Novotel Moscow City</button>
          <button class="dropdown-item">Park Inn by Radisson</button>
          <button class="dropdown-item">Ibis Moscow Centre</button>
          <hr style="margin:6px 0;border:none;border-top:1px solid var(--border)">
          <button class="dropdown-item">+ Добавить объект</button>
        </div>
      </div>

      <!-- Status badge -->
      <div class="status-badge">
        <div class="status-dot"></div>
        <span class="status-text">Активный</span>
        <button class="hint-btn" style="position:relative">
          i
          <div class="tooltip">Объект активен и принимает бронирования</div>
        </button>
      </div>
    </div>

    <div class="header-right">
      <!-- User dropdown -->
      <div style="position:relative">
        <button class="user-btn" id="userBtn" onclick="toggleMenu('userMenu', 'userBtn')">
          <div class="avatar">К</div>
          <div class="user-info">
            <span class="user-name">Константин Я.</span>
            <span class="user-email">k.yakovlev@emergingtravel.com</span>
          </div>
          <svg class="chevron-icon" id="userChevron" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 5L7 9L11 5" stroke="#2D3137" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="dropdown-menu" id="userMenu">
          <button class="dropdown-item">Настройки профиля</button>
          <button class="dropdown-item">Помощь</button>
          <hr style="margin:6px 0;border:none;border-top:1px solid var(--border)">
          <button class="dropdown-item danger">Выйти</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Top navigation -->
  <nav class="top-nav">
    <button class="nav-item active" onclick="setTopNav(this)">Отель</button>
    <button class="nav-item" onclick="setTopNav(this)">Доступность и цены</button>
    <button class="nav-item" onclick="setTopNav(this)">Бронирования</button>
    <button class="nav-item" onclick="setTopNav(this)">Номера и тарифы</button>
    <button class="nav-item" onclick="setTopNav(this)">Договоры и счета</button>
    <button class="nav-item" onclick="setTopNav(this)">Промо</button>
  </nav>
</header>

<!-- ─── BODY ─── -->
<div class="body-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-items">
      <button class="sidebar-item" onclick="setSidebar(this)">Информация</button>
      <button class="sidebar-item" onclick="setSidebar(this)">Услуги и особенности</button>
      <button class="sidebar-item" onclick="setSidebar(this)">Оплата и налоги</button>
      <button class="sidebar-item active" onclick="setSidebar(this)">Условия</button>
      <button class="sidebar-item" onclick="setSidebar(this)">Отзывы</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <div class="content-card">
      <h2 class="section-title">Стоимость</h2>
      <p class="section-subtitle">Здесь настраиваются цены для всех номеров и дат</p>

      <!-- Age cards widget -->
      <div class="widget">

        <!-- Card 1: До 2 лет -->
        <div class="age-card" id="card0">
          <div class="card-head">
            <span class="card-title">До 2 лет</span>
            <div style="position:relative">
              <button class="kebab-btn" onclick="toggleKebab(0, event)" aria-label="Меню">
                <div class="kebab-dots">
                  <div class="kebab-dot"></div>
                  <div class="kebab-dot"></div>
                  <div class="kebab-dot"></div>
                </div>
              </button>
              <div class="kebab-menu" id="kebab0">
                <button class="kebab-action" onclick="editCard(0)">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.333 2a1.886 1.886 0 0 1 2.667 2.667L5.333 13.333 2 14l.667-3.333L11.333 2z" stroke="#2D3137" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Редактировать
                </button>
                <button class="kebab-action danger" onclick="deleteCard(0)">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5.333 4V2.667h5.334V4M6.667 7.333v4M9.333 7.333v4M3.333 4l.667 9.333h8L12.667 4" stroke="#CE2121" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Удалить
                </button>
              </div>
            </div>
          </div>
          <div class="card-price">
            <span class="price-label">На любом месте</span>
            <span class="badge blue">Бесплатно</span>
          </div>
        </div>

        <!-- Card 2: 3–7 лет -->
        <div class="age-card" id="card1">
          <div class="card-head">
            <span class="card-title">3–7 лет</span>
            <div style="position:relative">
              <button class="kebab-btn" onclick="toggleKebab(1, event)" aria-label="Меню">
                <div class="kebab-dots">
                  <div class="kebab-dot"></div>
                  <div class="kebab-dot"></div>
                  <div class="kebab-dot"></div>
                </div>
              </button>
              <div class="kebab-menu" id="kebab1">
                <button class="kebab-action" onclick="editCard(1)">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.333 2a1.886 1.886 0 0 1 2.667 2.667L5.333 13.333 2 14l.667-3.333L11.333 2z" stroke="#2D3137" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Редактировать
                </button>
                <button class="kebab-action danger" onclick="deleteCard(1)">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5.333 4V2.667h5.334V4M6.667 7.333v4M9.333 7.333v4M3.333 4l.667 9.333h8L12.667 4" stroke="#CE2121" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Удалить
                </button>
              </div>
            </div>
          </div>
          <div class="card-price">
            <span class="price-label">Бесплатно на основном месте.<br>На дополнительном –</span>
            <div class="price-row">
              <span class="badge blue">50%</span>
              <span class="price-desc">от тарифа за 1 гостя</span>
            </div>
          </div>
        </div>

        <!-- Card 3: 8–10 лет -->
        <div class="age-card" id="card2">
          <div class="card-head">
            <span class="card-title">8–10 лет</span>
            <div style="position:relative">
              <button class="kebab-btn" onclick="toggleKebab(2, event)" aria-label="Меню">
                <div class="kebab-dots">
                  <div class="kebab-dot"></div>
                  <div class="kebab-dot"></div>
                  <div class="kebab-dot"></div>
                </div>
              </button>
              <div class="kebab-menu" id="kebab2">
                <button class="kebab-action" onclick="editCard(2)">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.333 2a1.886 1.886 0 0 1 2.667 2.667L5.333 13.333 2 14l.667-3.333L11.333 2z" stroke="#2D3137" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Редактировать
                </button>
                <button class="kebab-action danger" onclick="deleteCard(2)">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5.333 4V2.667h5.334V4M6.667 7.333v4M9.333 7.333v4M3.333 4l.667 9.333h8L12.667 4" stroke="#CE2121" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Удалить
                </button>
              </div>
            </div>
          </div>
          <div class="card-price">
            <span class="price-label">На любом месте</span>
            <span class="badge blue">1 000 ₽</span>
          </div>
        </div>

        <!-- Card 4: 11–17 лет (disabled) -->
        <div class="age-card disabled" style="width:144px">
          <div class="card-head">
            <span class="card-title muted">11–17 лет</span>
          </div>
          <div class="card-price">
            <span class="price-label muted">Не размещаются</span>
            <span class="badge red">
              <div class="no-icon"></div>
            </span>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- ─── PINNED FOOTER ─── -->
<div class="pinned-footer">
  <div class="pinned-inner">
    <button class="btn btn-primary" onclick="save()">Сохранить</button>
    <button class="btn btn-secondary" onclick="reset()">Сбросить</button>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Edit modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:20px;padding:32px;width:440px;position:relative;box-shadow:0 24px 64px rgba(0,0,0,0.16)">
    <h3 style="font-size:20px;font-weight:700;margin-bottom:20px;color:var(--text)" id="modalTitle">Редактировать условие</h3>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:14px;font-weight:500;color:var(--text-muted);display:block;margin-bottom:6px">Возрастная группа</label>
        <input id="modalAge" type="text" style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);outline:none;transition:border-color 0.15s" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div>
        <label style="font-size:14px;font-weight:500;color:var(--text-muted);display:block;margin-bottom:6px">Стоимость</label>
        <select id="modalType" style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);outline:none;background:white;cursor:pointer" onchange="toggleModalFields()">
          <option value="free">Бесплатно</option>
          <option value="percent">Процент от тарифа</option>
          <option value="fixed">Фиксированная сумма</option>
        </select>
      </div>
      <div id="modalValueWrap" style="display:none">
        <label style="font-size:14px;font-weight:500;color:var(--text-muted);display:block;margin-bottom:6px" id="modalValueLabel">Значение</label>
        <input id="modalValue" type="number" style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);outline:none" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px">
      <button onclick="closeModal()" style="flex:1;height:44px;border:none;border-radius:12px;background:#FF0000;color:white;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font)">Отмена</button>
      <button onclick="saveModal()" style="flex:1;height:44px;border:none;border-radius:12px;background:#FF0000;color:white;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font)">Сохранить</button>
    </div>
  </div>
</div>

<script>
let activeKebab = null;
let activeMenu = null;
let editingCard = null;

// ─── Menu toggles ───
function toggleMenu(menuId, btnId) {
  const menu = document.getElementById(menuId);
  const isOpen = menu.classList.contains('open');
  closeAll();
  if (!isOpen) {
    menu.classList.add('open');
    activeMenu = menu;
    document.getElementById('overlay').classList.add('active');
    // rotate chevron
    const chevId = btnId === 'hotelBtn' ? 'hotelChevron' : 'userChevron';
    document.getElementById(chevId).style.transform = 'rotate(180deg)';
  }
}

function toggleKebab(index, e) {
  e.stopPropagation();
  const menu = document.getElementById('kebab' + index);
  const isOpen = menu.classList.contains('open');
  closeAll();
  if (!isOpen) {
    menu.classList.add('open');
    activeKebab = menu;
    document.getElementById('overlay').classList.add('active');
  }
}

function closeAll() {
  document.querySelectorAll('.dropdown-menu.open, .kebab-menu.open').forEach(m => m.classList.remove('open'));
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('hotelChevron').style.transform = '';
  document.getElementById('userChevron').style.transform = '';
  activeKebab = null;
  activeMenu = null;
}

document.getElementById('overlay').addEventListener('click', closeAll);

// ─── Top nav ───
function setTopNav(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

// ─── Sidebar ───
function setSidebar(el) {
  document.querySelectorAll('.sidebar-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

// ─── Kebab actions ───
function editCard(index) {
  closeAll();
  editingCard = index;
  const titles = ['До 2 лет', '3–7 лет', '8–10 лет'];
  document.getElementById('modalTitle').textContent = 'Редактировать: ' + titles[index];
  document.getElementById('modalAge').value = titles[index];
  document.getElementById('editModal').style.display = 'flex';
}

function deleteCard(index) {
  closeAll();
  const titles = ['До 2 лет', '3–7 лет', '8–10 лет'];
  const card = document.getElementById('card' + index);
  card.style.transition = 'opacity 0.3s, transform 0.3s';
  card.style.opacity = '0';
  card.style.transform = 'scale(0.9)';
  setTimeout(() => {
    card.style.display = 'none';
    showToast('Условие «' + titles[index] + '» удалено');
  }, 300);
}

// ─── Modal ───
function toggleModalFields() {
  const type = document.getElementById('modalType').value;
  const wrap = document.getElementById('modalValueWrap');
  const label = document.getElementById('modalValueLabel');
  if (type === 'free') {
    wrap.style.display = 'none';
  } else {
    wrap.style.display = 'block';
    label.textContent = type === 'percent' ? 'Процент (%)' : 'Сумма (₽)';
  }
}

function closeModal() {
  document.getElementById('editModal').style.display = 'none';
  editingCard = null;
}

function saveModal() {
  closeModal();
  showToast('Изменения сохранены');
}

// ─── Save / Reset ───
function save() {
  const btn = document.querySelector('.btn-primary');
  btn.textContent = '✓ Сохранено';
  btn.style.background = '#279600';
  showToast('Настройки успешно сохранены');
  setTimeout(() => {
    btn.textContent = 'Сохранить';
    btn.style.background = '';
  }, 2000);
}

function reset() {
  showToast('Изменения сброшены');
  // restore deleted cards
  for (let i = 0; i < 3; i++) {
    const card = document.getElementById('card' + i);
    if (card) {
      card.style.display = '';
      card.style.opacity = '';
      card.style.transform = '';
    }
  }
}

// ─── Toast ───
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// Close menus on escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeAll();
    closeModal();
  }
});
</script>
</body>
</html>
